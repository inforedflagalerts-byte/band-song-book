<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Band Song Book 🎵</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background music decoration -->
    <div class="music-bg">
        <span>♪</span>
        <span>♫</span>
        <span>♩</span>
        <span>♬</span>
        <span>♪</span>
        <span>♫</span>
    </div>


    <!-- HEADER -->

    <header class="hero">

        <div class="music-logo">
            🎵
        </div>

        <p class="small-title">
            BAND MUSIC LIBRARY
        </p>

        <h1>
            Song <span>Book</span>
        </h1>

        <p class="subtitle">
            Chords & Lyrics — Everything your band needs.
        </p>

    </header>


    <!-- MAIN -->

    <main class="container">


        <!-- BUTTONS -->

        <div class="tabs">

            <button
                id="chordsBtn"
                class="tab-btn active"
            >
                <span>🎸</span>
                CHORDS
            </button>


            <button
                id="lyricsBtn"
                class="tab-btn"
            >
                <span>🎤</span>
                LYRICS
            </button>

        </div>


        <!-- CHORD SECTION -->

        <section
            id="chordsSection"
            class="section"
        >

            <div class="section-header">

                <div>

                    <p class="section-label">
                        GUITAR • BAND • MUSIC
                    </p>

                    <h2>
                        Chord Library
                    </h2>

                </div>

                <div class="music-symbol">
                    ♫
                </div>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <span>⌕</span>

                <input
                    id="chordSearch"
                    type="text"
                    placeholder="Search chord songs..."
                    autocomplete="off"
                >

            </div>


            <!-- SONGS -->

            <div
                id="chordList"
                class="song-grid"
            >

            </div>

        </section>



        <!-- LYRICS SECTION -->

        <section
            id="lyricsSection"
            class="section hidden"
        >

            <div class="section-header">

                <div>

                    <p class="section-label">
                        VOCALS • WORDS • MUSIC
                    </p>

                    <h2>
                        Lyrics Library
                    </h2>

                </div>

                <div class="music-symbol">
                    ♪
                </div>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <span>⌕</span>

                <input
                    id="lyricSearch"
                    type="text"
                    placeholder="Search lyrics..."
                    autocomplete="off"
                >

            </div>


            <!-- LYRICS -->

            <div
                id="lyricList"
                class="song-grid"
            >

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-line"></div>

        <p>
            🎵 BAND SONG BOOK
        </p>

        <small>
            Your music. Your songs. Your band.
        </small>

    </footer>


    <script src="app.js"></script>

</body>
</html>
