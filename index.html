<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0713">
    <meta name="description" content="Band Song Book - Chords and Lyrics">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <title>Band Song Book</title>
</head>

<body>
<header class="topbar">
    <div class="brand">
        <div class="brand-icon">♫</div>
        <div>
            <h1>Song Book</h1>
            <p>Chords & Lyrics</p>
        </div>
    </div>
    <div class="online-status" id="status">● Checking...</div>
</header>

<main class="container">
    <div class="tabs">
        <button id="chordsBtn" class="tab active" type="button">🎸 Chords</button>
        <button id="lyricsBtn" class="tab" type="button">🎤 Lyrics</button>
    </div>

    <section id="chordsSection">
        <div class="section-title">
            <div>
                <small>YOUR MUSIC LIBRARY</small>
                <h2>Chord Sheets</h2>
            </div>
            <span id="chordCount">0</span>
        </div>

        <div class="search">
            <span>⌕</span>
            <input id="chordSearch" type="search" placeholder="Search songs..." autocomplete="off">
        </div>

        <div id="chordList" class="song-list"></div>
    </section>

    <section id="lyricsSection" class="hidden">
        <div class="section-title">
            <div>
                <small>YOUR MUSIC LIBRARY</small>
                <h2>Lyrics</h2>
            </div>
            <span id="lyricCount">0</span>
        </div>

        <div class="search">
            <span>⌕</span>
            <input id="lyricSearch" type="search" placeholder="Search songs..." autocomplete="off">
        </div>

        <div id="lyricList" class="song-list"></div>
    </section>
</main>

<footer>
    <div class="footer-note">♫ Made for musicians</div>
    <small>Band Song Book © 2026</small>
</footer>

<!-- IMAGE VIEWER + OPTIONAL FULL SCREEN -->
<div id="viewer" class="viewer hidden" aria-hidden="true">
    <div class="viewer-bar">
        <div>
            <div id="viewerTitle" class="viewer-title">Song</div>
            <div id="viewerStatus" class="viewer-status">Ready</div>
        </div>
        <div class="viewer-actions">
            <button id="fullscreenViewer" class="viewer-action" type="button" aria-label="Full screen" title="Full screen">⛶</button>
            <button id="closeViewer" class="close" type="button" aria-label="Close">×</button>
        </div>
    </div>

    <div class="viewer-body" id="viewerBody">
        <div id="viewerLoading" class="viewer-loading hidden">
            <div class="spinner"></div>
            <div>Loading image...</div>
        </div>

        <div id="viewerError" class="viewer-error hidden">
            <div class="error-icon">☁</div>
            <strong>Image is not saved on this device</strong>
            <p>Turn on internet and open this song once to save it for offline use.</p>
        </div>

        <img id="viewerImage" src="" alt="Song sheet">
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
